<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="t">
  <title id="t">Jagdish Patil: AI-native builder and aspiring Forward Deployed Engineer</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f6f8fa"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.5" r="0.45">
      <stop offset="0" stop-color="#ff5a1f" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#ff5a1f" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#000000" fill-opacity="0.06"/>
    </pattern>
  </defs>
  <rect width="1200" height="300" rx="16" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="16" fill="url(#dots)"/>
  <rect width="1200" height="300" rx="16" fill="url(#glow)"/>
  <rect x="0.5" y="0.5" width="1199" height="299" rx="16" fill="none" stroke="#d0d7de"/>

  <g font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif">
    <text x="72" y="104" font-size="20" font-weight="600" fill="#d9480f" letter-spacing="3">HI, I'M</text>
    <text x="70" y="168" font-size="64" font-weight="700" fill="#1f2328">Jagdish Patil</text>
    <text x="72" y="214" font-size="25" fill="#424a53">AI-native builder · aspiring Forward Deployed Engineer</text>
    <text x="72" y="250" font-size="19" fill="#656d76">AI agent tools and web apps, shipped live</text>
  </g>

  <!-- three agents, linked -->
  <g stroke="#d0d7de" stroke-width="2" fill="none">
    <path d="M940 110 L1060 150 L960 210 Z"/>
  </g>
  <g stroke="#ff5a1f" stroke-width="2" stroke-dasharray="6 6" fill="none" stroke-opacity="0.8">
    <path d="M940 110 L1060 150"/>
  </g>
  <circle cx="940" cy="110" r="22" fill="#ffffff" stroke="#ff5a1f" stroke-width="3"/>
  <circle cx="1060" cy="150" r="28" fill="#ffffff" stroke="#1f2328" stroke-width="3"/>
  <circle cx="960" cy="210" r="18" fill="#ffffff" stroke="#8c959f" stroke-width="3"/>
  <circle cx="940" cy="110" r="7" fill="#ff5a1f"/>
  <circle cx="1060" cy="150" r="9" fill="#1f2328"/>
  <circle cx="960" cy="210" r="6" fill="#8c959f"/>
</svg>
